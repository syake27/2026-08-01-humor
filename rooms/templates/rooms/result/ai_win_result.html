<!-- AI対戦時の勝ちのresult画面 -->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>しりとり - けっか画面(かち)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/rooms/static/rooms/2style.css">

</head>

<body>

  <div class="phone">
    <div class="blob-tl"></div>
    <div class="blob-br"></div>
    <div class="dotgrid">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="float-dot fd1"></div>
    <div class="float-dot fd2"></div>
    <div class="float-dot fd3"></div>

    <div class="confetti" id="confetti"></div>

    <div class="statusbar"> 📶 📡 🔋</div>

    <div class="content">
      <div class="eyebrow"><span class="dot"></span> けっかはっぴょう</div>

      <div class="title-wrap">
        <span class="accent left">ヽ</span>
        <div class="title">
          <span>か</span><span>ち</span><span>！</span>
        </div>
        <span class="accent right">ノ</span>
      </div>

      <div class="subtitle">さいごまでよくがんばったね!</div>

      <div class="badge-icon">🏆</div>

      <div class="stat-card">
        <div class="stat-row">
          <div class="stat-icon" style="background:var(--purple);color:#fff;">🤖</div>
          <div class="stat-text">
            <div class="stat-label">たいせんあいて</div>
            <div class="stat-value">AI</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="action-btn filled" style="--btn-color:var(--blue);">
          <div class="action-icon">🔁</div>
          <div class="action-label">もういちど遊ぶ</div>
          <div class="action-chevron">›</div>
        </button>
        <button class="action-btn" style="--btn-color:var(--sub);">
          <div class="action-icon" style="background:#F1F2F5;color:var(--sub);">🏠</div>
          <div class="action-label" style="color:var(--ink);">ホームにもどる</div>
          <div class="action-chevron" style="color:var(--sub);">›</div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const confetti = document.getElementById('confetti');
    const confettiColors = ['#F2545B', '#4A90E2', '#FFB627', '#4CAF50', '#8B5CF6'];
    for (let i = 0; i < 26; i++) {
      const el = document.createElement('i');
      el.style.left = Math.random() * 100 + '%';
      el.style.background = confettiColors[i % confettiColors.length];
      el.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
      el.style.animationDelay = (Math.random() * 2) + 's';
      confetti.appendChild(el);
    }
  </script>
</body>

</html>
