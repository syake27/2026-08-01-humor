{% extends "rooms/base.html" %}
{% load static %}

{% block title %}しりとりアプリ{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'rooms/css/home.css' %}?v=20260806-5">
<!-- アイコン用 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
{% endblock %}

{% block content %}
<!-- 背景装飾 -->
<div class="decoration decoration-blue"></div>
<div class="decoration decoration-green"></div>
<div class="small-circle circle-pink"></div>
<div class="small-circle circle-blue"></div>
<div class="small-circle circle-purple"></div>

<!-- タイトル -->
<section class="hero">

  <h1 class="logo" aria-label="BABAHIDE">
    <img
      class="logo-image"
      src="{% static 'rooms/images/BABAHIDE.png' %}"
      alt="BABAHIDE"
    >
  </h1>

  <p class="catch-copy">
    ことばでつなぐ、たのしいバトル！
  </p>

</section>

<!-- メニュー -->
<nav class="menu">

  <!-- 1. マッチ -->
  <a href="{% url 'rooms:match' %}" class="menu-item menu-match">

    <span class="menu-icon match-icon">
      <i class="fa-solid fa-user-group"></i>
      <small>VS</small>
    </span>

    <span class="menu-text">
      マッチ
    </span>

    <span class="menu-arrow">
      <i class="fa-solid fa-chevron-right"></i>
    </span>

  </a>

  <!-- 2. AI -->
  <a href="{% url 'rooms:ai' %}" class="menu-item menu-ai">

    <span class="menu-icon">
      <i class="fa-solid fa-robot"></i>
    </span>

    <span class="menu-text">
      AI
    </span>

    <span class="menu-arrow">
      <i class="fa-solid fa-chevron-right"></i>
    </span>

  </a>

  <!-- 3. ショップ -->
  <a href="{% url 'rooms:shop' %}" class="menu-item menu-gacha">

    <span class="menu-icon">
      <i class="fa-solid fa-capsules"></i>
    </span>

    <span class="menu-text">
      ショップ
    </span>

    <span class="menu-arrow">
      <i class="fa-solid fa-chevron-right"></i>
    </span>

  </a>

  <!-- 4. ルール -->
  <a href="{% url 'rooms:rule' %}" class="menu-item menu-rule">

    <span class="menu-icon">
      <i class="fa-solid fa-clipboard-list"></i>
    </span>

    <span class="menu-text">
      ルール
    </span>

    <span class="menu-arrow">
      <i class="fa-solid fa-chevron-right"></i>
    </span>

  </a>

  <!-- 5. プロフィール -->
  <a href="{% url 'rooms:profile' %}" class="menu-item menu-profile">

    <span class="menu-icon">
      <i class="fa-solid fa-user"></i>
    </span>

    <span class="menu-text">
      プロフィール
    </span>

    <span class="menu-arrow">
      <i class="fa-solid fa-chevron-right"></i>
    </span>

  </a>

</nav>
{% endblock %}
