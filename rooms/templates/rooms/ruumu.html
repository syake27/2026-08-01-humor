<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しりとりルーム</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700;800&display=swap');

    :root {
      --ink: #3e455f;
      --muted: #858da6;
      --green: #43ae7c;
      --page: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f9f9fc;
      color: var(--ink);
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .screen {
      width: min(100%, 828px);
      min-height: 100vh;
      margin: auto;
      padding: 72px 21px 50px;
      position: relative;
      background: var(--page);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
    }

    .circle-button {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      font-size: 46px;
      font-weight: 400;
      line-height: 1;
      box-shadow: 0 10px 26px rgba(59, 57, 80, .09);
    }

    .help {
      justify-self: end;
      background: #fff1d5;
      color: #d7a12e;
      font-size: 32px;
      font-weight: 800;
    }

    .title {
      text-align: center;
      line-height: 1.1;
    }

    .title-ja {
      display: block;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: .045em;
    }

    .title-en {
      display: block;
      margin-top: 11px;
      color: #8189a0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 218px;
      margin-top: 59px;
      padding: 42px 42px 42px 40px;
      border-radius: 43px;
      background: linear-gradient(112deg, #fff0d9 0%, #ffe1e0 100%);
      box-shadow: 0 18px 35px rgba(195, 153, 132, .10);
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .hero p {
      margin: 0;
      color: #6e7181;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.7;
      letter-spacing: .04em;
    }

    .crown {
      flex: 0 0 auto;
      margin-left: 15px;
      font-size: 54px;
      filter: drop-shadow(0 5px 4px rgba(136, 95, 20, .16));
    }

    .room-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      width: 100%;
      margin-top: 26px;
    }

    .room-search input {
      min-width: 0;
      height: 69px;
      padding: 0 22px;
      border: 1.5px solid #edf0f6;
      border-radius: 23px;
      outline: none;
      color: var(--ink);
      background: #fbfcff;
      box-shadow: 0 8px 19px rgba(57, 59, 77, .045);
      font: inherit;
      font-size: 19px;
      font-weight: 700;
    }

    .room-search input::placeholder {
      color: #a7aec0;
    }

    .room-search input:focus {
      border-color: #ffb3ad;
      box-shadow: 0 0 0 4px rgba(255, 136, 125, .12);
    }

    .room-search button {
      min-width: 120px;
      height: 69px;
      padding: 0 18px;
      border-radius: 23px;
      color: #fff;
      background: #69718b;
      font-size: 18px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 20px;
      margin: 27px 4px 25px;
    }

    .tab {
      min-width: 120px;
      padding: 14px 20px;
      border-radius: 30px;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
    }

    .rooms {
      display: grid;
      gap: 23px;
    }

    .room {
      display: grid;
      grid-template-columns: 87px 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 142px;
      padding: 24px 28px;
      border-radius: 42px;
      background: #fff;
      box-shadow: 0 12px 29px rgba(57, 59, 77, .075);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 87px;
      height: 84px;
      border-radius: 29px;
      font-size: 42px;
    }

    .strawberry {
      background: #e6d9ff;
    }

    .sprout {
      background: #dff4ef;
    }

    .coffee {
      background: #ffe8ca;
    }

    .bubble {
      background: #dceaff;
    }

    .room-name {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .room-detail {
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .status {
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .join {
      background: #e3f5ed;
      color: var(--green);
    }

    .playing {
      background: #fff1dc;
      color: #dc913f;
    }

    .full {
      background: #f0e9fb;
      color: #9979bc;
    }

    .create-room {
      width: 100%;
      min-height: 105px;
      margin-top: 186px;
      border-radius: 35px;
      color: #fff;
      background: linear-gradient(100deg, #ff887d, #ff686d);
      box-shadow: 0 16px 28px rgba(246, 109, 109, .25);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    @media (max-width: 600px) {
      .screen {
        padding: 42px 18px 28px;
      }

      .topbar {
        grid-template-columns: 56px 1fr 56px;
      }

      .circle-button {
        width: 56px;
        height: 56px;
        font-size: 37px;
      }

      .help {
        font-size: 26px;
      }

      .title-ja {
        font-size: clamp(26px, 7vw, 38px);
      }

      .title-en {
        margin-top: 7px;
        font-size: clamp(14px, 4vw, 20px);
      }

      .hero {
        min-height: 0;
        margin-top: 43px;
        padding: 30px 25px;
        border-radius: 31px;
      }

      .hero h1 {
        font-size: clamp(22px, 6vw, 31px);
      }

      .hero p {
        font-size: clamp(16px, 4.5vw, 21px);
      }

      .crown {
        font-size: clamp(38px, 10vw, 52px);
      }

      .room-search {
        gap: 8px;
        margin-top: 20px;
      }

      .room-search input {
        height: 57px;
        padding: 0 15px;
        border-radius: 18px;
        font-size: 15px;
      }

      .room-search button {
        min-width: 87px;
        height: 57px;
        padding: 0 12px;
        border-radius: 18px;
        font-size: 15px;
      }

      .tabs {
        gap: 4px;
        margin: 22px 0 20px;
        justify-content: space-between;
      }

      .tab {
        min-width: 0;
        padding: 12px 13px;
        font-size: clamp(15px, 4.5vw, 20px);
      }

      .rooms {
        gap: 16px;
      }

      .room {
        grid-template-columns: 62px 1fr auto;
        gap: 14px;
        min-height: 105px;
        padding: 19px 17px;
        border-radius: 29px;
      }

      .icon {
        width: 62px;
        height: 62px;
        border-radius: 20px;
        font-size: 32px;
      }

      .room-name {
        margin-bottom: 4px;
        font-size: clamp(18px, 5vw, 24px);
      }

      .room-detail {
        font-size: clamp(13px, 3.7vw, 18px);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        padding: 7px 10px;
        font-size: clamp(12px, 3.6vw, 16px);
      }

      .create-room {
        min-height: 76px;
        margin-top: 105px;
        border-radius: 27px;
        font-size: clamp(20px, 5.7vw, 27px);
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <header class="topbar">
      <button class="circle-button" aria-label="戻る">‹</button>
      <div class="title"><span class="title-ja">しりとりルーム</span><span class="title-en">SHIRITORI ROOM</span></div>
      <button class="circle-button help" aria-label="ヘルプ">?</button>
    </header>

    <section class="hero" aria-labelledby="intro-title">
      <div>
        <h1 id="intro-title">みんなで、ことば遊び。</h1>
        <p>好きなルームを選んで<br>しりとりをはじめよう！</p>
      </div>
      <span class="crown" aria-hidden="true">👑</span>
    </section>

    <form class="room-search" action="#rooms" role="search">
      <input type="search" name="room-id" aria-label="ルームID" placeholder="ルームIDを入力して検索" />
      <button type="submit">検索</button>
    </form>

    <nav class="tabs" aria-label="ルームの絞り込み">
      <button class="tab active" aria-current="page">すべて</button>
      <button class="tab">参加できる</button>
      <button class="tab">対戦中</button>
    </nav>

    <section class="rooms" aria-label="ルーム一覧">
      <article class="room">
        <div class="icon strawberry">🍓</div>
        <div>
          <h2 class="room-name">ゆるっとしりとり</h2>
          <p class="room-detail">あと１人でスタート ・ 2 / 3 人</p>
        </div><span class="status join">参加する</span>
      </article>
      <article class="room">
        <div class="icon sprout">🌱</div>
        <div>
          <h2 class="room-name">ことばの森</h2>
          <p class="room-detail">「り」からはじまる言葉 ・ 3 / 4 人</p>
        </div><span class="status playing">対戦中</span>
      </article>
      <article class="room">
        <div class="icon coffee">☕</div>
        <div>
          <h2 class="room-name">おひるのしりとり部</h2>
          <p class="room-detail">のんびりモード ・ 1 / 4 人</p>
        </div><span class="status join">参加する</span>
      </article>
      <article class="room">
        <div class="icon bubble">🫧</div>
        <div>
          <h2 class="room-name">夜ふかしワード</h2>
          <p class="room-detail">定員に達しました ・ 4 / 4 人</p>
        </div><span class="status full">満室</span>
      </article>
    </section>

    <button class="create-room">＋ 新しいルームをつくる</button>
  </main>
</body>

</html>
