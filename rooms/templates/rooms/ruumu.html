<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しりとり王 - ルーム一覧</title>
  <style>
    :root {
      --ink: #3d4157;
      --muted: #858aa2;
      --coral: #ff847c;
      --cream: #fffaf2;
      --line: #f0edf3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .content {
      position: relative;
      width: min(100%, 430px);
      min-height: 100vh;
      margin: auto;
      padding: 32px 20px 105px;
      background: #fff;
    }

    /* 背景の飾り */
    .decoration {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    .decoration-top-left {
      top: -54px;
      left: -45px;
      width: 178px;
      height: 178px;
      border-radius: 42% 58% 62% 38% / 44% 45% 55% 56%;
      background: #e8f0fb;
    }

    .decoration-red {
      top: 155px;
      left: 13%;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #ffd2d5;
    }

    .decoration-blue {
      top: 33%;
      right: 8%;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #c9ddfa;
    }

    .decoration-purple {
      bottom: 145px;
      left: 5%;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #d9c9fa;
    }

    .decoration-green-small {
      bottom: 48px;
      left: 7%;
      width: 68px;
      height: 68px;
      background: radial-gradient(circle, #dbeedb 3px, transparent 4px) 0 0 / 22px 22px;
    }

    .decoration-bottom-green {
      right: -46px;
      bottom: -58px;
      width: 177px;
      height: 182px;
      border-radius: 58% 42% 0 0 / 52% 42% 0 0;
      background: #e3f2df;
    }

    .content {
      z-index: 1;
      background: transparent;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 28px;
    }

    .back {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .82);
      color: var(--ink);
      font-size: 25px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(72, 75, 105, .08);
    }

    .title {
      text-align: center;
    }

    .title h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: .05em;
    }

    .title p {
      margin: 4px 0 0;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .12em;
    }

    .help {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff4d9;
      color: #dcaa40;
      font-weight: 800;
    }

    .hero {
      padding: 21px 20px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff0dc, #ffe5e0);
      box-shadow: 0 10px 24px rgba(203, 124, 111, .13);
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero h2 {
      margin: 0;
      font-size: 19px;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 13px;
      color: #736d76;
      line-height: 1.55;
    }

    .crown {
      font-size: 34px;
      transform: rotate(-8deg);
    }

    .filter {
      display: flex;
      gap: 8px;
      margin: 22px 2px 14px;
    }

    .chip {
      border: 0;
      padding: 8px 13px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .7);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--ink);
      color: white;
    }

    .room-list {
      display: grid;
      gap: 11px;
    }

    .room {
      display: grid;
      grid-template-columns: 43px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 7px 18px rgba(65, 66, 91, .07);
    }

    .avatar {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 22px;
    }

    .a1 {
      background: #e8ddff;
    }

    .a2 {
      background: #dff3ee;
    }

    .a3 {
      background: #ffe8cd;
    }

    .a4 {
      background: #dceaff;
    }

    .room-name {
      font-weight: 800;
      font-size: 14px;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      font-size: 10px;
      font-weight: 800;
      padding: 6px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .open {
      color: #44a978;
      background: #e4f7ed;
    }

    .playing {
      color: #d78d45;
      background: #fff1dd;
    }

    .full {
      color: #9b87b7;
      background: #eee8f8;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 19px 2px 0;
      padding: 0 13px;
      border: 1px solid #ebe9f0;
      border-radius: 14px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 5px 14px rgba(65, 66, 91, .05);
      color: #a2a6b5;
    }

    .search span {
      font-size: 17px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 13px 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    .search input::placeholder {
      color: #a2a6b5;
    }

    .empty {
      display: none;
      margin: 25px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="app">
    <!-- 背景の飾り -->
    <div class="decoration decoration-top-left"></div>
    <div class="decoration decoration-red"></div>
    <div class="decoration decoration-blue"></div>
    <div class="decoration decoration-purple"></div>
    <div class="decoration decoration-green-small"></div>
    <div class="decoration decoration-bottom-green"></div>
    <div class="content">
      <header>
        <button class="back" aria-label="戻る">‹</button>
        <div class="title">
          <h1>しりとりルーム</h1>
          <p>SHIRITORI ROOM</p>
        </div>
        <span class="help">?</span>
      </header>
      <section class="hero">
        <div class="hero-row">
          <div>
            <h2>みんなで、ことば遊び。</h2>
            <p>好きなルームを選んで<br>しりとりをはじめよう！</p>
          </div>
          <div class="crown">👑</div>
        </div>
      </section>
      <label class="search" for="roomSearch"><span aria-hidden="true">⌕</span><input id="roomSearch" type="search"
          placeholder="ルーム名で検索"></label>
      <nav class="filter" aria-label="ルームの絞り込み"><button class="chip active">すべて</button><button
          class="chip">参加できる</button><button class="chip">対戦中</button></nav>
      <section class="room-list" aria-label="ルーム一覧">
        <article class="room" data-state="open">
          <div class="avatar a1">🍓</div>
          <div>
            <div class="room-name">ゆるっとしりとり</div>
            <div class="meta">あと 1 人でスタート ・ 2 / 3 人</div>
          </div><span class="status open">参加する</span>
        </article>
        <article class="room" data-state="playing">
          <div class="avatar a2">🌱</div>
          <div>
            <div class="room-name">ことばの森</div>
            <div class="meta">「り」からはじまる言葉 ・ 3 / 4 人</div>
          </div><span class="status playing">対戦中</span>
        </article>
        <article class="room" data-state="open">
          <div class="avatar a3">☕️</div>
          <div>
            <div class="room-name">おひるのしりとり部</div>
            <div class="meta">のんびりモード ・ 1 / 4 人</div>
          </div><span class="status open">参加する</span>
        </article>
        <article class="room" data-state="full">
          <div class="avatar a4">🫧</div>
          <div>
            <div class="room-name">夜ふかしワード</div>
            <div class="meta">定員に達しました ・ 4 / 4 人</div>
          </div><span class="status full">満室</span>
        </article>
      </section>
      <p class="empty" id="empty">該当するルームはありません</p>
    </div>
  </main>
  <script>
    const rooms = [...document.querySelectorAll('.room')];
    const search = document.querySelector('#roomSearch');
    const empty = document.querySelector('#empty');
    const updateRooms = () => { const mode = document.querySelector('.chip.active').textContent; const keyword = search.value.trim().toLowerCase(); let visible = 0; rooms.forEach(room => { const matchesFilter = mode === 'すべて' || (mode === '参加できる' ? room.dataset.state === 'open' : room.dataset.state === 'playing'); const matchesSearch = room.textContent.toLowerCase().includes(keyword); room.hidden = !(matchesFilter && matchesSearch); if (!room.hidden) visible++; }); empty.style.display = visible ? 'none' : 'block'; };
    document.querySelectorAll('.chip').forEach(chip => chip.onclick = () => { document.querySelector('.chip.active').classList.remove('active'); chip.classList.add('active'); updateRooms(); });
    search.addEventListener('input', updateRooms);
  </script>
</body>

</html>
